function rec(i){const n=NEEDS[i],s=SP[n[2]];$('#rec').innerHTML=`<div class="lab">${P('We suggest','نقترح')}</div><h3 style="margin:6px 0">${P(...s.n)} · ${fmt(s.rate)}/${P('hour','ساعة')}</h3><p class="tx" style="margin:0 0 12px">${P(...n[3])}</p><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn alt" href="#${n[2]}">${P('See details','التفاصيل')}</a><button class="btn" id="rb">${P('Book it','احجزها')}</button></div>`;$('#rb').onclick=()=>{B.sp=n[2];B.step=2;B.hour=null;location.hash='#book'}}
function bookBind(){const m=$('#main');const re=()=>show(true);const on=(sel,fn)=>m.querySelectorAll(sel).forEach(b=>b.onclick=()=>fn(b));
on('[data-sp]',b=>{B.sp=b.dataset.sp;B.hour=null;B.guests=1;B.student=false;if(B.dur===9&&!SP[B.sp].day)B.dur=1;re()});on('[data-day]',b=>{B.day=+b.dataset.day;B.hour=null;if(B.dur===9)B.dur=1;re()});on('[data-hour]',b=>{B.hour=+b.dataset.hour;if(B.dur===9)B.dur=1;if(B.hour+B.dur>18)B.dur=18-B.hour;re()});on('[data-dur]',b=>{B.dur=+b.dataset.dur;if(B.dur===9)B.hour=9;re()});on('[data-g]',b=>{B.guests=+b.dataset.g;re()});
const st=$('#stu');if(st)st.onchange=()=>{B.student=st.checked;re()};
on('[data-go]',b=>{const g=+b.dataset.go;B.err={};if(g>B.step){if(B.step===2){if(B.hour==null){B.err.t=P('Please choose a start time.','اختر وقت البدء.');return re()}const end=B.dur===9?18:B.hour+B.dur;for(let h=B.hour;h<end;h++)if(busy(B.sp,B.day,h)!=='free'){B.err.t=P('That time overlaps a taken slot. Try a shorter duration or another time.','هذا الوقت يتداخل مع وقت محجوز. جرّب مدة أقصر أو وقتًا آخر.');return re()}}
if(B.step===3){B.name=$('#nm').value.trim();B.email=$('#em').value.trim();B.phone=$('#ph').value.trim();if(!B.name)B.err.n=P('Please enter your name.','أدخل اسمك.');if(!/^\S+@\S+\.\S+$/.test(B.email))B.err.e=P('Enter a valid email, like name@example.com.','أدخل بريدًا صحيحًا مثل name@example.com.');if(B.err.n||B.err.e)return re();B.ref='BB-'+(1000+Math.floor(Math.random()*9000))}}
B.step=g;show();scrollTo(0,0);const h1=$('#main h1');h1.setAttribute('tabindex','-1');h1.focus({preventScroll:true})});
const ic=$('#ics');if(ic)ic.onclick=e=>{e.preventDefault();const d=dayOf(B.day),p=n=>String(n).padStart(2,'0'),ds=h=>`${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(h)}0000`;const t=`BEGIN:VCALENDAR\nVERSION:2.0\nBEGIN:VEVENT\nSUMMARY:${SP[B.sp].n[0]} booking · Big Bang Workspace\nDTSTART:${ds(B.hour)}\nDTEND:${ds(B.dur===9?18:B.hour+B.dur)}\nEND:VEVENT\nEND:VCALENDAR`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/calendar'}));a.download='big-bang-workspace-booking.ics';a.click()}}
function supBind(){let sel=-1;const m=$('#main');m.querySelectorAll('[data-iss]').forEach(b=>b.onclick=()=>{sel=+b.dataset.iss;m.querySelectorAll('[data-iss]').forEach(x=>{x.setAttribute('aria-pressed',x===b);x.setAttribute('aria-checked',x===b)});$('#s1').textContent=''});
$('#sbm').onclick=()=>{if(sel<0){$('#s1').textContent=P('Please choose what is wrong.','اختر نوع المشكلة.');return}const ref='REQ-'+(1000+Math.floor(Math.random()*9000));$('#sf').style.display='none';$('#sd').innerHTML=`<div class="ok" style="margin-top:24px" role="status"><div class="lab" style="color:var(--ok)">${ref}</div><h2 style="margin-top:6px">${P('Thanks, we’ve got it.','شكرًا، وصلنا البلاغ.')}</h2><p>${P('Your report goes to IT and reception with the room you chose. (Demo: nothing is really sent.)','يذهب بلاغك إلى الدعم التقني والاستقبال مع الغرفة التي اخترتها. (تجريبي: لا يُرسل شيء.)')}</p><a class="btn alt" href="#home">${P('Back home','الرئيسية')}</a></div>`}}
$('#lang').onclick=()=>{LG=LG==='en'?'ar':'en';show(true)};$('#theme').onclick=toggleTheme;addEventListener('hashchange',()=>{show();scrollTo(0,0);$('#main').focus({preventScroll:true})});show();
</script></body></html>
